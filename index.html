<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campsite Master Plan Library 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 8s linear infinite;
        }
    </style>
</head>
<body class="bg-stone-50 text-stone-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 設定 ---
        // 公開環境でAIを動かす場合は、ここにAPIキーを入力してください
        const apiKey = ""; 
        const appId = "campsite-project";

        // アイコンコンポーネント
        const Icon = ({ name, className = "w-6 h-6" }) => {
            const icons = {
                compass: <path d="m16.24 7.76-1.41 4.95-4.95 1.41 1.41-4.95 4.95-1.41ZM9 9l4.5 4.5m-4.5 0L13.5 9M22 12A10 10 0 1 1 2 12a10 10 0 0 1 20 0Z" />,
                trees: (<><path d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0 1 6 0Z"/><path d="M18 14v.2A3 3 0 0 1 16.9 20H13a3 3 0 0 1-1-5.8V14a3 3 0 0 1 6 0Z"/><path d="M14 10V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v4"/><path d="M18 14v-4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v4"/><circle cx="7" cy="18" r="2"/><circle cx="15" cy="12" r="2"/></>),
                waves: (<><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></>),
                sun: (<><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></>),
                users: (<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>),
                sparkles: <path d="m12 3 1.91 5.82L20 10.73l-4.54 4.42L16.55 21 12 17.27 7.45 21l1.09-5.85L4 10.73l6.09-1.91L12 3Z"/>,
                x: (<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>),
                maximize: (<><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></>),
                chevron: <path d="m9 18 6-6-6-6"/>,
                loader: (<><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></>)
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const CATEGORIES = ["すべて", "景観重視", "プライバシー", "環境配慮", "ラグジュアリー", "交流重視"];

        const PRESET_IDEAS = Array.from({ length: 20 }, (_, i) => {
            const id = i + 1;
            const paddedId = String(id).padStart(2, '0');
            const category = CATEGORIES[1 + (i % (CATEGORIES.length - 1))];
            return {
                id,
                title: `コンセプト案 #${paddedId}`,
                category,
                // GitHub Pagesのルートにdataフォルダがある場合を想定
                localImage: `data/img${paddedId}.png`,
                altPath: `public/data/img${paddedId}.png`,
                description: `img${paddedId}.png をベースにしたデザイン案。自然の形状を活かした配置計画です。`,
                points: ["地形の活用", "プライベート空間", "自然素材の採用"],
                gear: "高機能アウトドアギア",
                imagePrompt: `A beautiful ${category} campsite visual, cinematic lighting, high resolution.`
            };
        });

        function App() {
            const [selectedIdea, setSelectedIdea] = useState(null);
            const [activeCategory, setActiveCategory] = useState("すべて");
            const [generatedImages, setGeneratedImages] = useState({});
            const [loadingImages, setLoadingImages] = useState({});
            const [failedImages, setFailedImages] = useState({});

            const filteredIdeas = activeCategory === "すべて" 
                ? PRESET_IDEAS 
                : PRESET_IDEAS.filter(idea => idea.category === activeCategory);

            const generateImageForIdea = async (id, prompt) => {
                if (!apiKey || generatedImages[id] || loadingImages[id]) return;
                setLoadingImages(prev => ({ ...prev, [id]: true }));
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            instances: [{ prompt }],
                            parameters: { sampleCount: 1 }
                        })
                    });
                    const data = await response.json();
                    if (data.predictions?.[0]) {
                        setGeneratedImages(prev => ({ ...prev, [id]: `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}` }));
                    }
                } catch (e) { console.error(e); }
                finally { setLoadingImages(prev => ({ ...prev, [id]: false })); }
            };

            const handleImageError = (idea, e) => {
                const currentSrc = e.target.src;
                
                // 1回目のエラー: 代替パス(public/...)を試す
                if (!currentSrc.includes(idea.altPath) && !currentSrc.startsWith('data:')) {
                    console.log(`Retrying with alt path for ${idea.id}`);
                    e.target.src = idea.altPath;
                } 
                // 2回目のエラー: AI生成を試みる（APIキーがある場合）
                else if (apiKey && !generatedImages[idea.id]) {
                    generateImageForIdea(idea.id, idea.imagePrompt);
                }
                // 万策尽きた場合: プレースホルダーを表示
                else {
                    e.target.src = `https://placehold.co/600x400/f5f5f4/065f46?text=Image+img${String(idea.id).padStart(2, '0')}.png+Missing`;
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    {!apiKey && (
                        <div className="max-w-7xl mx-auto mb-6 p-4 bg-emerald-100 border border-emerald-200 text-emerald-800 rounded-xl text-xs flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <Icon name="sun" className="w-5 h-5" />
                                <span>画像が表示されない場合は、<code>data</code> フォルダ内に <code>img01.png</code> ... が正しく配置されているか確認してください。</span>
                            </div>
                            <span className="font-mono text-[10px] opacity-50 hidden md:block">GitHub Pages Path Mode</span>
                        </div>
                    )}

                    <header className="max-w-7xl mx-auto mb-12 text-center">
                        <div className="flex justify-center mb-4">
                            <div className="p-3 bg-emerald-700 text-white rounded-2xl shadow-lg">
                                <Icon name="compass" className="w-8 h-8" />
                            </div>
                        </div>
                        <h1 className="text-4xl font-bold text-emerald-950 mb-4 tracking-tight">CampDesign Ideas 2026</h1>
                        <div className="flex flex-wrap justify-center gap-2 mb-8">
                            {CATEGORIES.map(cat => (
                                <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-5 py-2 rounded-full text-sm font-medium transition-all ${activeCategory === cat ? "bg-emerald-700 text-white shadow-md" : "bg-white text-stone-500 border"}`}>
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        {filteredIdeas.map(idea => (
                            <div key={idea.id} onClick={() => setSelectedIdea(idea)} className="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all cursor-pointer border border-stone-200 group">
                                <div className="h-48 bg-stone-100 relative overflow-hidden">
                                    <img 
                                        src={generatedImages[idea.id] || idea.localImage} 
                                        alt={idea.title}
                                        className="w-full h-full object-cover group-hover:scale-105 transition-transform"
                                        onError={(e) => handleImageError(idea, e)}
                                    />
                                    {loadingImages[idea.id] && (
                                        <div className="absolute inset-0 flex items-center justify-center bg-white/50 backdrop-blur-[2px]">
                                            <Icon name="loader" className="w-6 h-6 animate-spin text-emerald-700" />
                                        </div>
                                    )}
                                </div>
                                <div className="p-4">
                                    <div className="text-[10px] text-stone-400 font-mono mb-1 flex justify-between">
                                        <span>img{String(idea.id).padStart(2, '0')}.png</span>
                                        {generatedImages[idea.id] && <span className="text-emerald-500">AI Generated</span>}
                                    </div>
                                    <h3 className="font-bold text-stone-800 line-clamp-1">{idea.title}</h3>
                                    <div className="mt-4 text-[10px] font-bold text-emerald-700 uppercase flex items-center justify-between">
                                        詳細を表示 <Icon name="chevron" className="w-3 h-3" />
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {selectedIdea && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/80 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-4xl rounded-3xl overflow-hidden relative animate-in zoom-in-95 duration-200">
                                <button onClick={() => setSelectedIdea(null)} className="absolute top-4 right-4 p-2 bg-white/80 rounded-full shadow-md z-10 hover:bg-white transition-colors">
                                    <Icon name="x" className="w-5 h-5 text-stone-600" />
                                </button>
                                <div className="flex flex-col md:flex-row">
                                    <div className="md:w-1/2 h-64 md:h-auto bg-stone-100">
                                        <img 
                                            src={generatedImages[selectedIdea.id] || selectedIdea.localImage} 
                                            className="w-full h-full object-cover"
                                            onError={(e) => {
                                                if (e.target.src !== selectedIdea.altPath) e.target.src = selectedIdea.altPath;
                                            }}
                                        />
                                    </div>
                                    <div className="md:w-1/2 p-8">
                                        <div className="flex justify-between items-start mb-2">
                                            <span className="text-emerald-600 font-bold text-[10px] uppercase tracking-widest">{selectedIdea.category}</span>
                                            <span className="text-[10px] font-mono text-stone-400">img{String(selectedIdea.id).padStart(2, '0')}.png</span>
                                        </div>
                                        <h2 className="text-2xl font-bold mb-4">{selectedIdea.title}</h2>
                                        <p className="text-stone-500 text-sm mb-6 leading-relaxed">{selectedIdea.description}</p>
                                        
                                        <div className="space-y-4 mb-8">
                                            <div className="bg-stone-50 p-4 rounded-xl">
                                                <h4 className="text-xs font-bold text-stone-700 mb-2">デザインのポイント</h4>
                                                <ul className="text-xs text-stone-500 space-y-1">
                                                    {selectedIdea.points.map((p, i) => <li key={i}>• {p}</li>)}
                                                </ul>
                                            </div>
                                        </div>

                                        <button onClick={() => setSelectedIdea(null)} className="w-full py-3 bg-emerald-900 text-white rounded-xl font-bold text-sm hover:bg-emerald-800 transition-colors">
                                            閉じる
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
