<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャンプ場マスタープラン集 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 8s linear infinite;
        }
    </style>
</head>
<body class="bg-stone-50 text-stone-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 設定 ---
        const apiKey = ""; 
        const appId = "campsite-project";

        // アイコンコンポーネント
        const Icon = ({ name, className = "w-6 h-6" }) => {
            const icons = {
                compass: <path d="m16.24 7.76-1.41 4.95-4.95 1.41 1.41-4.95 4.95-1.41ZM9 9l4.5 4.5m-4.5 0L13.5 9M22 12A10 10 0 1 1 2 12a10 10 0 0 1 20 0Z" />,
                trees: (<><path d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0 1 6 0Z"/><path d="M18 14v.2A3 3 0 0 1 16.9 20H13a3 3 0 0 1-1-5.8V14a3 3 0 0 1 6 0Z"/><path d="M14 10V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v4"/><path d="M18 14v-4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v4"/><circle cx="7" cy="18" r="2"/><circle cx="15" cy="12" r="2"/></>),
                waves: (<><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></>),
                sun: (<><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></>),
                users: (<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>),
                sparkles: <path d="m12 3 1.91 5.82L20 10.73l-4.54 4.42L16.55 21 12 17.27 7.45 21l1.09-5.85L4 10.73l6.09-1.91L12 3Z"/>,
                x: (<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>),
                maximize: (<><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></>),
                chevron: <path d="m9 18 6-6-6-6"/>,
                loader: (<><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></>)
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const CATEGORIES = ["すべて", "施設", "アクティビティ", "環境", "ラグジュアリー", "交流"];

        // --- ここで各コンセプト案を直接編集してください ---
        const PRESET_IDEAS = [
            {
                id: 1,
                title: "#01 キャンプ場の入り口",
                category: "施設",
                localImage: "img01.png",
                description: "ワクワクするようでシンプルな標識にする",
                points: ["特別感", "大自然の入り口", "シンプルでレトロな照明"],
                gear: "シンプルな木材、レトロな照明",
            },
            {
                id: 2,
                title: "#02 子供達の創造力",
                category: "知育環境",
                localImage: "img02.png",
                description: "キャンプ場の廃材を生かし、積み木やブロックなどをふんだんに用意する",
                points: ["知育", "工作", "自由空間", "後片付け"],
                gear: "木材、おまちゃ箱",
            },
            {
                id: 3,
                title: "#03 エコサイト - サステナブル",
                category: "環境配慮",
                localImage: "img03.png",
                description: "オフグリッドを体現。太陽光発電と雨水利用システムを備え、自給自足の体験を提供します。",
                points: ["ソーラーパネル完備", "エディブル・ガーデン", "コンポストトイレ"],
                gear: "ポータブル電源、ソーラークッカー",
            },
            {
                id: 4,
                title: "#04 共同トイレ",
                category: "施設",
                localImage: "img04.png",
                description: "",
                points: ["", "屋外共同", "手洗い場"],
                gear: "",
            },
            {
                id: 5,
                title: "#05 コミュニティ・ハブ",
                category: "施設・交流",
                localImage: "img05.png",
                description: "中央に巨大な共有焚き火場を配置。ソロキャンパー同士が自然に会話を楽しめる空間です。",
                points: ["アイランドキッチン", "サークル状ベンチ", "共有ラウンジ"],
                gear: "大型鋳物鍋、スパイスセット",
                imagePrompt: "Circular communal campsite hub at night with central fire pit."
            },
            { id: 6, title: "#06 新規コンセプト案", category: "景観重視", localImage: "img06.png", description: "ここを編集して新しい案を記載してください。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 7, title: "#07 新規コンセプト案", category: "プライバシー", localImage: "img07.png", description: "説明文を入力。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 8, title: "#08 黒板ウォール（創造体験）", category: "知育", localImage: "img08.png", description: "屋外に設置する黒板ウォールのイメージです。子どもたちが自然の中で感じたことを自由に描き、創造力や表現力を育む体験を提供します。身体を動かす遊びだけでなく、落ち着いて楽しめる活動を用意することで、幅広い年齢層に対応できるエリアとなります。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 9, title: "#09 すべり台・キッズゾーン", category: "アクティビティ", localImage: "img09.png", description: "斜面地形を活かした大型の木製すべり台です。自然の地形そのものを遊び場として活用することで、子どもたちが繰り返し遊びたくなる体験を創出します。この施設は、家族連れを引き寄せるランドマークとして、キャンプ場全体のにぎわいづくりにも貢献します。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 10, title: "#10 新規コンセプト案", category: "交流重視", localImage: "img10.png", description: "説明文を入力。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 11, title: "#11 新規コンセプト案", category: "景観重視", localImage: "img11.png", description: "説明文を入力。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 12, title: "#12 新規コンセプト案", category: "プライバシー", localImage: "img12.png", description: "説明文を入力。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 13, title: "#13 新規コンセプト案", category: "環境配慮", localImage: "img13.png", description: "説明文を入力。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 14, title: "#14 新規コンセプト案", category: "ラグジュアリー", localImage: "img14.png", description: "説明文を入力。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 15, title: "#15 新規コンセプト案", category: "交流重視", localImage: "img15.png", description: "説明文を入力。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 16, title: "#16 新規コンセプト案", category: "景観重視", localImage: "img16.png", description: "説明文を入力。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 17, title: "#17 新規コンセプト案", category: "プライバシー", localImage: "img17.png", description: "説明文を入力。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 18, title: "#18 新規コンセプト案", category: "環境配慮", localImage: "img18.png", description: "説明文を入力。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 19, title: "#19 新規コンセプト案", category: "ラグジュアリー", localImage: "img19.png", description: "説明文を入力。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" },
            { id: 20, title: "#20 新規コンセプト案", category: "交流重視", localImage: "img20.png", description: "説明文を入力。", points: ["ポイント A", "ポイント B"], gear: "装備 X", imagePrompt: "Campsite visualization" }
        ];

        function App() {
            const [selectedIdea, setSelectedIdea] = useState(null);
            const [activeCategory, setActiveCategory] = useState("すべて");
            const [generatedImages, setGeneratedImages] = useState({});
            const [loadingImages, setLoadingImages] = useState({});

            const filteredIdeas = activeCategory === "すべて" 
                ? PRESET_IDEAS 
                : PRESET_IDEAS.filter(idea => idea.category === activeCategory);

            const generateImageForIdea = async (id, prompt) => {
                if (!apiKey || generatedImages[id] || loadingImages[id]) return;
                setLoadingImages(prev => ({ ...prev, [id]: true }));
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            instances: [{ prompt }],
                            parameters: { sampleCount: 1 }
                        })
                    });
                    const data = await response.json();
                    if (data.predictions?.[0]) {
                        setGeneratedImages(prev => ({ ...prev, [id]: `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}` }));
                    }
                } catch (e) { console.error(e); }
                finally { setLoadingImages(prev => ({ ...prev, [id]: false })); }
            };

            const handleImageError = (idea, e) => {
                // 無限ループ防止
                if (e.target.dataset.errored) return;
                e.target.dataset.errored = "true";

                if (apiKey && idea.imagePrompt && !generatedImages[idea.id]) {
                    generateImageForIdea(idea.id, idea.imagePrompt);
                } else {
                    const label = encodeURIComponent(idea.title || idea.localImage);
                    e.target.src = `https://placehold.co/600x400/d1fae5/065f46?text=${label}`;
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <header className="max-w-7xl mx-auto mb-12 text-center">
                        <div className="flex justify-center mb-4">
                            <div className="p-3 bg-emerald-700 text-white rounded-2xl shadow-lg">
                                <Icon name="compass" className="w-8 h-8" />
                            </div>
                        </div>
                        <h1 className="text-4xl font-bold text-emerald-950 mb-4 tracking-tight">キャンプ場マスタープラン集 2026</h1>
                        <p className="text-stone-500 mb-8">各カードのタイトルや説明文は HTML 内の PRESET_IDEAS 配列で直接編集できます。</p>
                        
                        <div className="flex flex-wrap justify-center gap-2 mb-8">
                            {CATEGORIES.map(cat => (
                                <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-5 py-2 rounded-full text-sm font-medium transition-all ${activeCategory === cat ? "bg-emerald-700 text-white shadow-md scale-105" : "bg-white text-stone-500 border border-stone-200 hover:bg-stone-50"}`}>
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        {filteredIdeas.map(idea => (
                            <div key={idea.id} onClick={() => setSelectedIdea(idea)} className="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all cursor-pointer border border-stone-200 group flex flex-col">
                                <div className="h-48 bg-stone-100 relative overflow-hidden">
                                    <img 
                                        src={generatedImages[idea.id] || idea.localImage} 
                                        alt={idea.title}
                                        className="w-full h-full object-cover group-hover:scale-105 transition-transform"
                                        onError={(e) => handleImageError(idea, e)}
                                    />
                                    <div className="absolute top-3 left-3 bg-white/90 backdrop-blur px-2 py-1 rounded text-[10px] font-bold text-emerald-800 uppercase tracking-tighter shadow-sm">
                                        {idea.category}
                                    </div>
                                    {loadingImages[idea.id] && (
                                        <div className="absolute inset-0 flex items-center justify-center bg-white/50 backdrop-blur-[2px]">
                                            <Icon name="loader" className="w-6 h-6 animate-spin text-emerald-700" />
                                        </div>
                                    )}
                                </div>
                                <div className="p-4 flex flex-col flex-grow">
                                    <div className="text-[10px] text-stone-400 font-mono mb-1">{idea.localImage}</div>
                                    <h3 className="font-bold text-stone-800 line-clamp-1 mb-2">{idea.title}</h3>
                                    <p className="text-stone-500 text-xs line-clamp-2 leading-relaxed flex-grow">
                                        {idea.description}
                                    </p>
                                    <div className="mt-4 text-[10px] font-bold text-emerald-700 uppercase flex items-center justify-between group-hover:translate-x-1 transition-transform tracking-widest">
                                        詳細を表示 <Icon name="chevron" className="w-3 h-3" />
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {selectedIdea && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/80 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-4xl rounded-3xl overflow-hidden relative animate-in zoom-in-95 duration-200">
                                <button onClick={() => setSelectedIdea(null)} className="absolute top-4 right-4 p-2 bg-white/80 rounded-full shadow-md z-10 hover:bg-white transition-colors">
                                    <Icon name="x" className="w-5 h-5 text-stone-600" />
                                </button>
                                <div className="flex flex-col md:flex-row">
                                    <div className="md:w-1/2 h-64 md:h-auto bg-stone-100">
                                        <img 
                                            src={generatedImages[selectedIdea.id] || selectedIdea.localImage} 
                                            className="w-full h-full object-cover"
                                            onError={(e) => handleImageError(selectedIdea, e)}
                                        />
                                    </div>
                                    <div className="md:w-1/2 p-8">
                                        <div className="flex justify-between items-start mb-2">
                                            <span className="text-emerald-600 font-bold text-[10px] uppercase tracking-widest">{selectedIdea.category}</span>
                                            <span className="text-[10px] font-mono text-stone-400">{selectedIdea.localImage}</span>
                                        </div>
                                        <h2 className="text-2xl font-bold mb-4">{selectedIdea.title}</h2>
                                        <p className="text-stone-500 text-sm mb-6 leading-relaxed">{selectedIdea.description}</p>
                                        
                                        <div className="space-y-4 mb-8">
                                            <div className="bg-stone-50 p-4 rounded-xl">
                                                <h4 className="text-xs font-bold text-stone-700 mb-2">デザインのポイント</h4>
                                                <ul className="text-xs text-stone-500 space-y-1">
                                                    {selectedIdea.points.map((p, i) => <li key={i}>• {p}</li>)}
                                                </ul>
                                            </div>
                                            <div className="bg-emerald-50 p-4 rounded-xl">
                                                <h4 className="text-xs font-bold text-emerald-800 mb-1">推奨装備</h4>
                                                <p className="text-emerald-600 text-xs italic">{selectedIdea.gear}</p>
                                            </div>
                                        </div>

                                        <button onClick={() => setSelectedIdea(null)} className="w-full py-3 bg-emerald-900 text-white rounded-xl font-bold text-sm hover:bg-emerald-800 transition-colors shadow-lg shadow-emerald-900/20">
                                            閉じる
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
